<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>MKR · Preview icônes v3 (Lutte vectorisée + MMA + Combo)</title>
<style>
  :root {
    --bg: #0b0b0b;
    --surface: rgba(255,255,255,0.025);
    --text-primary: #f8f8f8;
    --text-muted: rgba(248,248,248,0.5);
    --primary: #c84b31;
    --lutte: #4ade80;
    --mma: #f59e0b;
    --combo: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 32px;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 14px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--primary); margin: 0 0 8px; }
  h2 { font-size: 24px; margin: 0 0 40px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 48px; }
  .col {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }
  .col-lutte::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top right, rgba(74,222,128,0.10), transparent 60%);
    pointer-events: none;
  }
  .col-mma::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top right, rgba(245,158,11,0.10), transparent 60%);
    pointer-events: none;
  }
  .col-combo::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top right, rgba(167,139,250,0.10), transparent 60%);
    pointer-events: none;
  }
  .col h3 {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    position: relative;
    z-index: 1;
  }
  .icon-big {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 140px;
    position: relative;
    z-index: 1;
  }
  .icon-big svg { width: 110px; height: 110px; }
  .icon-medium {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 80px;
    position: relative;
    z-index: 1;
  }
  .icon-medium svg { width: 60px; height: 60px; }
  .icon-real {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 5px;
    position: relative;
    z-index: 1;
  }
  .icon-real svg { width: 36px; height: 36px; flex-shrink: 0; }
  .icon-real strong { font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; display: block; }
  .icon-real span { font-size: 11px; color: var(--text-muted); }
  .lutte svg { color: var(--lutte); }
  .mma svg { color: var(--mma); }
  .combo svg { color: var(--combo); }
</style>
</head>
